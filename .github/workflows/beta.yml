name: Check v2.0 Beta
on:
  push:
    branches: [beta]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc -p tsconfig.pages.json
      - run: node --test beta-service/worker.test.mjs
      - run: node scripts/build-beta.mjs
      # The public Pages deployment only runs from main. Beta deployment remains separate.
